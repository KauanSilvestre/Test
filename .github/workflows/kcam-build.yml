name: KCam build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["KCam/**", ".github/workflows/kcam-build.yml"]
  pull_request:
    paths: ["KCam/**", ".github/workflows/kcam-build.yml"]
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build (personal, free, pro)"
        required: false
        default: personal
      release:
        description: "Also build signed release APKs (needs the KCAM_* signing secrets)"
        type: boolean
        required: false
        default: false

concurrency:
  group: kcam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: KCam
    steps:
      - uses: actions/checkout@v4

      - name: Clone patched Media3 (fMP4 muxer fixes used by upstream FadCam)
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDefaultDebug -Pkcam.edition=${{ inputs.edition || 'personal' }} --no-configuration-cache

      - name: KCam unit tests
        run: ./gradlew :app:testDefaultDebugUnitTest --tests 'com.fadcam.kcam.*' --no-configuration-cache

      - name: Checksums (SHA-256)
        run: |
          cd KCam/app/build/outputs/apk/default/debug
          sha256sum *.apk | tee SHA256SUMS.txt
          {
            echo "### APKs Sentinela (debug) — SHA-256"
            echo ''
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KCam-debug-${{ github.sha }}
          path: |
            KCam/app/build/outputs/apk/default/debug/*.apk
            KCam/app/build/outputs/apk/default/debug/SHA256SUMS.txt
          if-no-files-found: error

  release:
    # Signed release APKs (single "default" flavor; no disguised variants).
    # Runs for tags v* or a manual run with "release" ticked. Requires repository
    # secrets: KCAM_KEYSTORE_BASE64, KCAM_KEYSTORE_PASSWORD, KCAM_KEY_ALIAS, KCAM_KEY_PASSWORD.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: KCam
    env:
      KS_B64: ${{ secrets.KCAM_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Signing secrets are missing: building UNSIGNED release APKs (not installable). See KCam/KCAM.md -> 'APK assinado'."
          fi

      - name: Clone patched Media3
        run: git clone --depth 1 https://github.com/anonfaded/media3-patched.git /tmp/media3-patched

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kcam.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kcam.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KCAM_KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KCAM_KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KCAM_KEY_PASSWORD }}"
          } > local.properties

      - name: Assemble signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDefaultRelease -Pkcam.edition=${{ inputs.edition || 'personal' }} --no-configuration-cache

      - name: Checksums (SHA-256)
        run: |
          cd KCam/app/build/outputs/apk/default/release
          sha256sum *.apk | tee SHA256SUMS.txt
          {
            echo "### APKs Sentinela (release) — SHA-256"
            echo ''
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: KCam-release${{ env.KS_B64 == '' && '-UNSIGNED' || '' }}-${{ github.sha }}
          path: |
            KCam/app/build/outputs/apk/**/release/*.apk
            KCam/app/build/outputs/apk/default/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.KS_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: KCam/app/build/outputs/apk/**/release/*.apk
          generate_release_notes: true
